<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖火計時器 - 117.45秒</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h1 {
            color: #ff9800;
            margin: 5px 0 5px 0;
            font-size: 1.5rem;
        }
        .sub {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .display {
            font-size: 5rem;
            color: #4caf50;
            font-weight: bold;
            margin: 20px 0;
        }
        .display.warning {
            color: #ff5252;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #startBtn {
            background-color: #ff9800;
            color: #121212;
        }
        #resetBtn {
            background-color: #424242;
            color: #ffffff;
        }
        .counter {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            color: #ffb74d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 聖火計時器</h1>
    <div class="sub">117.45秒版本</div>
    <div class="display" id="display">118</div>
    <div class="btn-group">
        <button id="startBtn" onclick="toggleTimer()">開始</button>
        <button id="resetBtn" onclick="resetTimer()">重置</button>
    </div>
    <div class="counter">
        已放：<span id="castCount" style="color:#fff;">0</span> 次
    </div>
</div>

<script>
    const CYCLE_TIME = 117.45;
    let timeLeft = CYCLE_TIME;
    let timerId = null;
    let isRunning = false;
    let audioCtx = null;
    let hasPlayedSound = false;
    let isFirst = true;
    let count = 0;

    function playSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            [523.25, 659.25, 1046.50].forEach((f, i) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0.2, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.8);
            });
        } catch(e) {}
    }

    function updateView() {
        document.getElementById('display').innerText = Math.ceil(timeLeft);
        if (timeLeft <= 12) {
            document.getElementById('display').classList.add('warning');
        } else {
            document.getElementById('display').classList.remove('warning');
        }
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerId);
            isRunning = false;
            document.getElementById('startBtn').innerText = '繼續';
        } else {
            if (isFirst) {
                playSound();
                count++;
                document.getElementById('castCount').innerText = count;
                isFirst = false;
            }
            isRunning = true;
            document.getElementById('startBtn').innerText = '暫停';
            
            let last = Date.now();
            timerId = setInterval(() => {
                let now = Date.now();
                let delta = (now - last) / 1000;
                last = now;
                
                timeLeft -= delta;

                if (timeLeft <= 12 && !hasPlayedSound) {
                    playSound();
                    hasPlayedSound = true;
                }

                if (timeLeft <= 0) {
                    timeLeft = CYCLE_TIME + timeLeft;
                    hasPlayedSound = false;
                    count++;
                    document.getElementById('castCount').innerText = count;
                }

                updateView();
            }, 100);
        }
    }

    function resetTimer() {
        clearInterval(timerId);
        isRunning = false;
        timeLeft = CYCLE_TIME;
        hasPlayedSound = false;
        isFirst = true;
        count = 0;
        document.getElementById('castCount').innerText = '0';
        document.getElementById('startBtn').innerText = '開始';
        updateView();
    }
</script>

</body>
</html>
